
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste B — Contador Original</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .teste {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #aaa;
            margin-bottom: 30px;
        }

        #contadorAniversario {
            padding: 30px 20px;
            border-radius: 20px;
            background: #0f1f36;
            border: 1px solid #1d4ed8;
        }

        .contador {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bloco {
            min-width: 70px;
            padding: 15px 10px;
            background: #07111f;
            border-radius: 12px;
        }

        .numero {
            display: block;
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa;
        }

        .texto {
            font-size: 12px;
            color: #aaa;
        }

        #diagnostico {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #111827;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }

        .ok {
            color: #4ade80;
        }

        .erro {
            color: #f87171;
        }
    </style>
</head>

<body>

    <main class="teste">

        <h1>🧪 Teste B</h1>

        <p class="subtitulo">
            Contador original do site
        </p>

        <section id="contadorAniversario">

            <div class="contador">

                <div class="bloco">
                    <span id="dias" class="numero">00</span>
                    <span class="texto">DIAS</span>
                </div>

                <div class="bloco">
                    <span id="horas" class="numero">00</span>
                    <span class="texto">HORAS</span>
                </div>

                <div class="bloco">
                    <span id="minutos" class="numero">00</span>
                    <span class="texto">MINUTOS</span>
                </div>

                <div class="bloco">
                    <span id="segundos" class="numero">00</span>
                    <span class="texto">SEGUNDOS</span>
                </div>

            </div>

        </section>

        <div id="diagnostico">
            <strong>Diagnóstico:</strong>
            <div id="estado">A iniciar...</div>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
